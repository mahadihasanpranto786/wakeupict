<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveStock</title>
    <style>
        body {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .container {
            display: flex;
            align-items: center;
            width: 100%;
            height: 100vh;
            background: rgb(2, 0, 36);
            background: linear-gradient(90deg, rgba(2, 0, 36, 1) 0%, rgba(0, 212, 255, 1) 50%, rgba(255, 255, 255, 1) 50%);
        }

        .container .img_part,
        .container .content {
            display: flex;
            justify-content: center;
            width: 50%;
        }

        .container .img_part img {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0px 0px 13px #020226;
        }

        .card {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 600px;
            height: 500px;
            max-height: 100%;
            max-width: 100%;
            box-shadow: -6px 8px 22px #979090;
            border-radius: 8px;
            text-align: center;
        }

        .card h1 {
            padding: 20px 0;
        }

        /* image animation */
        .animate_img {
            animation: animate_img ease-in-out 1s infinite alternate;
            transform-origin: center -20px;
        }

        @keyframes animate_img {
            0% {
                transform: rotate(3deg);
            }

            100% {
                transform: rotate(-3deg);
            }
        }

        /* card button */

        .card a {
            box-shadow: -4px 3px 14px #979090;
            display: block;
            width: 200px;
            height: 50px;
            background: #333;
            margin: auto;
            line-height: 50px;
            text-decoration: none;
            border-radius: 8px;
            color: #fff;
        }

        .card a:hover {
            background: #fff;
            color: #333;
        }

        @media screen and (max-width: 640px) {
            .container {
                background: rgba(0, 212, 255, 1);
            }

            .container .img_part {
                display: none;
            }

            .container .content {
                align-items: center;
                width: 100%;
            }

            .container .content .card {
                box-shadow: none;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="img_part">
            <img src="livestock.png" alt="LiveStock">
        </div>
        <div class="content">
            <div class="card">
                <div>
                    <div class="animate_img">
                        <img src="live_logo.png" width="60" height="60" alt="LiveStock logo">
                    </div>
                    <h1>Livestock Management System </h1>
                    <a  target="_blank" href="http://projects.wakeupict.com/livestock/auth/login">View Demo</a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
