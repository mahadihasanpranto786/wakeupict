name: Deploy Wake Up ICT to Live Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: 🚀 FTP Auto Deploy
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🌐 Sync Files via FTP to Server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/vendor/**
            **/public/khanmethodbd/**
            **/public/rjml/**
            **/public/projects/**
            **/public/stg/**
            **/public/abc/**
            **/public/sandbox/**
            **/tests/**
            **/.env*
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/.agents/**
            **/scratch/**
            **/phpunit.xml
            **/sql/**
            **/*.sql
            **/error_log*
            **/*.log
            **/*.md
